name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run check

      - name: Test indexing routes and metadata
        run: npm test

      - name: Test real Cloudflare and Node servers
        run: npm run test:runtime

      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run

      - name: Validate sitemap XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('frontend/sitemap.xml')
          print('sitemap.xml: valid XML')
          PY
