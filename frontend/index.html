<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Nexus TikTok Downloader</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-glow"></div>
  <header class="app-header">
    <div class="container header-container">
      <div class="logo"><span class="logo-accent">NEXUS</span><span class="logo-sub">TIKTOK</span></div>
      <div class="badge-status"><span class="status-dot"></span> Ready</div>
    </div>
  </header>
  <main class="container">
    <section class="hero-section">
      <h1 class="hero-title">Direct MP4 Video Retrieval</h1>
      <p class="hero-subtitle">Fast direct media stream resolver.</p>
      <form id="extract-form" class="search-box-card">
        <div class="input-wrapper">
          <input type="url" id="url-input" placeholder="Paste TikTok URL..." required />
          <div class="input-actions">
            <button type="button" id="paste-btn" class="btn-ghost">Paste</button>
            <button type="button" id="clear-btn" class="btn-ghost">Clear</button>
          </div>
        </div>
        <button type="submit" id="submit-btn" class="btn-primary">
          <span class="btn-text">Download</span>
        </button>
      </form>
      <div id="status-card" class="status-card hidden"><span id="status-text">Fetching video...</span></div>
      <div id="error-card" class="error-card hidden"><p id="error-message"></p></div>
    </section>
    <section id="result-section" class="result-section hidden">
      <div class="media-card">
        <div class="media-thumbnail-container">
          <img id="res-thumbnail" src="" alt="Thumbnail" />
          <span id="res-duration" class="duration-badge">0:00</span>
        </div>
        <div class="media-details">
          <div class="author-block">
            <img id="res-avatar" class="author-avatar" src="" alt="Avatar" />
            <div class="author-meta">
              <span id="res-author-name" class="author-name">Creator</span>
              <span id="res-author-user" class="author-user">@username</span>
            </div>
          </div>
          <h2 id="res-title" class="video-title">Video Description</h2>
          <div class="download-actions">
            <a id="download-standard-btn" href="#" class="btn-download" download>Download MP4</a>
            <a id="download-hd-btn" href="#" class="btn-download btn-hd hidden" download>Download HD MP4</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
